services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsappbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - whatsappbot_pgdata:/var/lib/postgresql/data

volumes:
  whatsappbot_pgdata:
